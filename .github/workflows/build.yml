name: T735 Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pmbootstrap from Source
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git openssl
          # Clone it directly as recommended by the pmOS wiki
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p $HOME/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" $HOME/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize and Build
        run: |
          # Use absolute paths to be safe
          pmbootstrap init -d samsung -p t735 <<EOF
          edge
          n
          rakzn
          EOF
          # Build the kernel
          pmbootstrap build linux-samsung-t735 --force
          pmbootstrap export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
