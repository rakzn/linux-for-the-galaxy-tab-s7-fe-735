name: T735 Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Force Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          # Install with --user flag but also set PYTHONPATH
          pip3 install --user pmbootstrap --break-system-packages || pip3 install --user pmbootstrap

      - name: Build
        run: |
          # Export both PATH and PYTHONPATH
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONPATH="$HOME/.local/lib/python3.11/site-packages:$PYTHONPATH"
          
          pmbootstrap init <<EOF
          $HOME/.local/var/pmbootstrap
          edge
          samsung
          t735
          n
          rakzn
          EOF
          pmbootstrap build linux-samsung-t735 --force
          pmbootstrap export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
