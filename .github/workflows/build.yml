name: T735 Alpine Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Alpine Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv git wget
          # Create a virtual environment 'bubble' for pmbootstrap
          python3 -m venv venv
          source venv/bin/activate
          pip install pmbootstrap
          # Make sure the 'pmb' command is accessible
          echo "$(pwd)/venv/bin" >> $GITHUB_PATH

      - name: Initialize pmbootstrap (Alpine)
        run: |
          source venv/bin/activate
          pmbootstrap init <<EOF
          $HOME/.local/var/pmbootstrap
          edge
          samsung
          t735
          n
          rakzn
          EOF

      - name: Build T735 Kernel
        run: |
          source venv/bin/activate
          # Force build to ensure DTS changes are included
          pmbootstrap build linux-samsung-t735 --force
          pmbootstrap export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Alpine-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
