name: T735 Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          # This installs it properly so all 'pmb' modules are found
          pip3 install --user pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          # We use 'python3 -m pmb' to make sure it finds the modules
          python3 -m pmb init <<EOF
          $HOME/.local/var/pmbootstrap
          edge
          samsung
          t735
          n
          rakzn
          EOF
          python3 -m pmb build linux-samsung-t735 --force
          python3 -m pmb export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
