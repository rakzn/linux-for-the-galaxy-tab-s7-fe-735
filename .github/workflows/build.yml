name: T735 Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
      options: --privileged # This gives the robot permission to build the kernel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          apk add --no-interactive python3 py3-pip git openssl sudo bash
          # Force install pmbootstrap ignoring the system block
          pip install --break-system-packages pmbootstrap

      - name: Build T735 Kernel
        run: |
          pmbootstrap init -d samsung -p t735 <<EOF
          n
          rakzn
          EOF
          pmbootstrap build linux-samsung-t735 --force
          pmbootstrap export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
