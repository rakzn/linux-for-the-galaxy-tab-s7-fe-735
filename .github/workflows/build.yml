name: T735 Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git wget
          # Using the official install method
          sudo wget https://gitlab.com/postmarketOS/pmbootstrap/-/raw/master/pmbootstrap.py -O /usr/local/bin/pmbootstrap
          sudo chmod +x /usr/local/bin/pmbootstrap

      - name: Build
        run: |
          pmbootstrap init <<EOF
          $HOME/.local/var/pmbootstrap
          edge
          samsung
          t735
          n
          rakzn
          EOF
          # This pulls your kernel code and builds the boot image
          pmbootstrap build linux-samsung-t735 --force
          pmbootstrap export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
