name: T735 Kernel Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pmbootstrap from Source
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p $HOME/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" $HOME/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize and Build
        run: |
          # Clear the failed workspace from 1766.png
          pmbootstrap zap -f
          
          # The answers MUST be in this exact order for version 3.10.1:
          pmbootstrap init <<EOF
          $HOME/.local/var/pmbootstrap
          edge
          samsung
          t735
          n
          rakzn
          EOF
          
          # Force the build to ensure your DTS changes are included
          pmbootstrap build linux-samsung-t735 --force
          pmbootstrap export

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: T735-Image
          path: /tmp/postmarketOS-export/boot.img-samsung-t735
